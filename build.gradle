// Bdragon — Forge 66.1.0 for Minecraft 26.3 (Java 25)
// Based on the official Forge MDK.

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = '1.8.0'
group = 'com.yb.dragons'

base {
    archivesName = 'bdragon'
}

// Mojang ships Java 25 to end users in 26.1+, so the mod targets Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }

        register('client')

        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    // JourneyMap API (optional map integration, compile only: JourneyMap itself is not needed to play)
    maven {
        name = 'BlameJared (JourneyMap API)'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'info.journeymap' }
    }
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.1.0')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
    compileOnly 'info.journeymap:journeymap-api-forge:26.3-2.0.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
